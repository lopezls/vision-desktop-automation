[project]
name = "vision-desktop-automation"
version = "0.1.0"
description = "Vision-based desktop automation with dynamic icon grounding (ScreenSeekeR-style)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
vision-automation = "vision_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_automation"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
